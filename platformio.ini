; PlatformIO project configuration.
;
;   pio run                 build
;   pio run -t upload       build and flash
;   pio run -e nano         build for an Arduino Nano instead
;
; The Arduino IDE works too - see README.md. This file exists so the
; MCP2515 library version is pinned rather than "whatever is installed".

[env]
platform  = atmelavr
framework = arduino
lib_deps  =
    coryjfowler/mcp_can@^1.5.0
build_flags =
    -Wall
    -Wextra
build_src_filter = +<*>
src_dir = slcan_firmware_uno
monitor_speed = 115200

[env:uno]
board = uno

[env:nano]
board = nanoatmega328new

[env:promicro]
; 32u4 boards expose a native USB CDC port: no auto-reset quirk, and the
; serial link is not limited by a UART, so a higher SERIAL_BAUDRATE in
; config.h costs nothing there.
board = sparkfun_promicro16
